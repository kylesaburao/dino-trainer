<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Game · CSS Network</title>
  <link rel="stylesheet" href="style.css">
  <!-- The AI's weights: every neuron is a calc() in this stylesheet. css-nn.js
       switches it to models-css/<id>.css when another model is selected. -->
  <link id="model-css" rel="stylesheet" href="model.css">
  <style>
    .status a { color: inherit; }
    .status .warn { color: #b00020; }
    #nn { position: absolute; width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="600" height="150"></canvas>
    <div class="controls">
      <label>Model <select id="model"></select></label>
      <label>Speed <select id="speed">
        <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
        <option value="16">16×</option><option value="32">32×</option><option value="64">64×</option><option value="128">128×</option>
        <option value="256">256×</option><option value="512">512×</option><option value="1024">1024×</option><option value="2048">2048×</option>
        <option value="4096">4096×</option>
      </select></label>
    </div>
    <div class="status" id="status">loading the CSS network…</div>
    <div class="status">Every decision is computed by the style engine from <a id="model-css-link" href="model.css">model.css</a>; JavaScript only writes the inputs and reads back <code>--act</code>.</div>
    <section class="netview" aria-label="Neural network view">
      <div class="netview-head">
        <button id="net-toggle" type="button" aria-controls="net-body">Network: shown</button>
        <span>Network <span id="net-arch"></span></span>
      </div>
      <div id="net-body">
        <canvas id="net-canvas" role="img" aria-label="Neural network activations for the latest CSS decision"></canvas>
        <div class="net-legend">
          <span><i style="background:#2a78d6"></i>positive</span>
          <span><i style="background:#e34948"></i>negative</span>
          <span>edge opacity = |weight × activation|</span>
          <span>ring = action from <code>--act</code></span>
        </div>
        <div class="net-caption" id="net-caption"></div>
        <div class="net-warn" id="net-warn" hidden></div>
        <div class="net-tip" id="net-tip"></div>
      </div>
    </section>
  </div>
  <!-- The network's inputs are written here; the model stylesheet computes --act on it. -->
  <div id="nn" class="css-net" aria-hidden="true"></div>
  <script src="core.js"></script>
  <script src="render.js"></script>
  <script src="policy.js"></script>
  <!-- The selectable models: ids, labels and CSS file names only (no weights). -->
  <script src="models-css/index.js"></script>
  <!-- For the network view only (its picture and its check of --act): the bundled
       models' weights as JavaScript. Decisions never come from them. -->
  <script src="models.js"></script>
  <script src="netview.js"></script>
  <script src="css-nn.js"></script>
</body>
</html>
