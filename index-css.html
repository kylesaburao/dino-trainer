<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Game · CSS Network</title>
  <link rel="stylesheet" href="style.css">
  <!-- The AI's weights: every neuron is a calc() in this stylesheet. -->
  <link rel="stylesheet" href="model.css">
  <style>
    .controls, .status { margin-top: 10px; font: 11px/1.6 monospace; color: #535353; text-align: center; }
    .controls select { font: inherit; color: inherit; background: #fff; border: 1px solid #535353; border-radius: 2px; }
    .status a { color: inherit; }
    .status .warn { color: #b00020; }
    #nn { position: absolute; width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="600" height="150"></canvas>
    <div class="controls">
      <label>Speed <select id="speed">
        <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
        <option value="16">16×</option><option value="32">32×</option><option value="64">64×</option><option value="128">128×</option>
        <option value="256">256×</option><option value="512">512×</option><option value="1024">1024×</option><option value="2048">2048×</option>
      </select></label>
    </div>
    <div class="status" id="status">loading the CSS network…</div>
    <div class="status" id="check"></div>
    <div class="status">Every decision is computed by the style engine from <a href="model.css">model.css</a>; JavaScript only writes the inputs and reads back <code>--act</code>.</div>
  </div>
  <!-- The network's inputs are written here; model.css computes --act on it. -->
  <div id="nn" class="css-net" aria-hidden="true"></div>
  <script src="core.js"></script>
  <script src="render.js"></script>
  <script src="policy.js"></script>
  <script src="model.js"></script>
  <script src="css-nn.js"></script>
</body>
</html>
